title: AI_HAZOP_REVIEWER_PATCH_L1
inputs:
  - rows_l1_json
  - row_hints_json
instructions: |
  You receive CURRENT AI-HAZOP-8800 L1 rows and targeted row-level hints.

  Your job:
  - Return the FULL list of L1 rows, in the SAME order and SAME length.
  - For any row whose "row_id" appears in row_hints_json:
      * Edit ONLY the fields listed in that hint's "fields" (subset of: ["failure_mode"]).
      * Keep "row_id", "guideword", and all context fields (component, aspect, ODD, scenario) UNCHANGED.
      * Ensure guideword → failure_mode is coherent, technical, and grounded in the row's scenario/ODD.
  - For any row NOT mentioned in row_hints_json: return it UNCHANGED (verbatim).

  Style & content rules:
  - CRITICAL: the "suggestion" field is USER GUIDANCE about what to improve.
    DO NOT copy the suggestion text into failure_mode. INTERPRET it and write NEW technical content.
  - failure_mode is a component-level deviation (one technical sentence), NOT a vehicle-level consequence.
  - COMPONENT LEVEL (hard rule): keep the failure mode at the row's own component_class level. For a
    perception/fusion/localization component, NEVER use downstream control/planning terms (braking,
    steering, throttle, accelerate/decelerate, trajectory, path/route, waypoint, control command,
    actuation, maneuver, swerve, "vehicle stops/does not stop in time"); describe a wrong OUTPUT of this
    component instead (e.g. a missed/false/mislocated detection, wrong class/confidence/position). For a
    control component the opposite holds (describe the wrong/late command, not detection/pixel terms).
  - If a hint is vague, infer a plausible concrete failure mode consistent with the guideword and component.

  STRICT OUTPUT: a top-level JSON ARRAY of row OBJECTS (same count as input). No outer wrapper, no prose.
output_schema: |
  type: array
  items:
    type: object
    required: [row_id, guideword, failure_mode]
    properties:
      row_id: { type: string }
      guideword: { type: string }
      failure_mode: { type: string }
constraints: |
  - Output JSON ONLY (an array of rows). Return the FULL list in the SAME order/length as rows_l1_json.
  - Non-targeted rows must be unchanged. Edit ONLY the listed fields for the targeted row_id(s).
  - failure_mode must match the guideword and stay component-level. Never use the ':' character.
  - Ban vague words (failure, issue, error) unless made specific.
  - Forbidden meta phrases inside fields: "ensure", "make sure", "provide", "be specific",
    "placeholder", "nominal", "no change", "unchanged".
payload_template: |
  {
    "rows_l1": {{rows_l1_json}},
    "row_hints": {{row_hints_json}}
  }
