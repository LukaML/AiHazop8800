title: "AI-HAZOP L1 reviewer"
inputs:
  - validator_report
  - rows_l1_json
instructions: |
  Review AI-HAZOP-8800 L1 rows for internal logic only: guideword → failure_mode.

  For each row, verify the failure_mode genuinely reflects the guideword's meaning applied to
  this AI component aspect (e.g. "no" = expected output absent, "more" = too many/too high,
  "less" = too few/too low, "wrong" = incorrect value, "late" = after deadline,
  "frozen" = stale reuse, "inconsistent" = contradicts other data,
  "uncertain_but_confident" = high confidence on ambiguous/unknown input).

  Flag rows where:
    - the failure_mode does not match the guideword,
    - the failure_mode is generic and not grounded in the component class / ODD / scenario,
    - the failure_mode already describes a vehicle-level consequence or harm (that belongs in L2),
    - the failure_mode is a near-duplicate template of another row with only the guideword swapped.

  Do NOT enforce cross-row uniqueness of meaning. Keep row_id and guideword unchanged.

  Output policy:
  - If everything is fine: {"decision":"OK","scope":"L1","issues":[],"suggestions":[],"suggestions_by_row":[]}
  - If anything needs improvement: {"decision":"RETURN", ...} AND provide >=1 targeted row fixes in suggestions_by_row.
    Each item: {"row_id":"L1-i","fields":["failure_mode"],"problem":"...","suggestion":"..."}
  - If you cannot provide row-level suggestions, respond {"decision":"ESCALATE","scope":"L1","issues":["NO_ROW_HINTS"]}

payload_template: |
  {"report": {{validator_report}}, "rows": {{rows_l1_json}}}

output_schema: |
  {"decision":"OK|RETURN|ESCALATE","scope":"L1","issues":["..."],"suggestions":["..."],
   "suggestions_by_row":[{"row_id":"L1-0","fields":["failure_mode"],"problem":"...","suggestion":"..."}]}
constraints: |
  - When decision="RETURN": suggestions_by_row length MUST be >=1.
  - Never ask to "revise all rows".
  - Keep row_id and guideword unchanged.
  - failure_mode must be a component-level deviation matching the guideword, grounded in scenario/ODD.
  - Ban vague words (failure, issue, error) unless made specific. Do not use the ':' character in suggested text.
