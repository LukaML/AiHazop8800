title: AI_HAZOP_L8_EVIDENCE
inputs:
  - rows_prev_json
  - evidence_json
instructions: |
  You receive AI-HAZOP-8800 rows ready for evidence planning. Each row carries the hazard, the
  safety_decision, and — for improved rows — the safety goals and proposed measures (respecifications,
  safety_functions, passive_operational_measures). ACCEPT rows carry no measures. "evidence_catalogue"
  lists evidence types, their purpose, typical test activities, and which evidence type supports which
  measure class.

  STRICT SCOPE: output ONLY evidence and open_assumptions. NEVER write reviewer/validator/repair
  instructions or copy any suggestion text.

  TASK: For EACH row, produce:
    - evidence: 1–4 concrete evidence items that VERIFY the proposed measures. Each item MUST
      reference the specific measure id(s) it verifies, written in parentheses, e.g.
      "(SF1) Fault injection on the monitor to confirm it flags insufficient cyclist observability and
      triggers conservative behavior." EVERY measure id present in the row's measures (R1, SF1, P1, ...)
      MUST be verified by at least one evidence item. Map evidence to measure type (safety-function
      monitor → fault injection / runtime verification; respecification/retraining → dataset audit +
      scenario validation; passive/operational → field monitoring / audit). Each item must be testable
      or reviewable, and MUST NOT merely restate the hazardous_behavior or the safety goal. For ACCEPT
      rows, give evidence that justifies accepting the risk (e.g. scenario validation showing the hazard
      does not occur in the ODD).
      For an ACCEPT row (no measures), evidence must be ACCEPTANCE evidence — what shows the risk is
      already below target (e.g. closed-loop scenario validation showing the hazard stays below the MEM
      target within this daylight campus ODD and speed limit, dataset audit confirming the scenario slice
      is represented, operational logs supporting the assumed low exposure) — NOT mitigation evidence. An
      ACCEPT evidence item MUST NOT reference any measure id (R1/SF1/P1) or name a measure class
      ("respecification", "safety function", "passive measure") — there are no measures to verify.

      GUIDEWORD-SPECIFIC evidence for improved rows (match the deviation, never copy-paste): frozen ->
      "(SF1) Fault injection with stale timestamps verifies stale object lists are rejected before
      publication."; corrupted -> "(SF1) Tensor corruption tests verify NaN/Inf/out-of-range values
      produce UNKNOWN output."; inverted -> "(SF1) Coordinate-frame regression tests verify left/right
      lateral positions are not swapped."; late -> "(SF1) Latency stress testing verifies detection age
      stays within the safety deadline."
    - open_assumptions: the conditions under which the result holds / required follow-ups. MUST be
      non-empty for EVERY ACCEPT row — state the acceptance conditions, e.g. "The ODD remains daylight,
      maximum 15 km/h, no dense fog.", "Traffic density stays consistent with the campus-shuttle
      scenario.", "Validation data remains representative of the defined ODD and scenario.", "The MEM
      target remains the selected acceptance criterion." For non-ACCEPT rows, 0–3 genuine assumptions.

  Echo each row's "row_id" exactly. Output ONLY the new fields plus row_id.

output_schema: |
  type: array
  items:
    type: object
    required: [row_id, evidence, open_assumptions]
    properties:
      row_id: { type: string }
      evidence: { type: array, items: { type: string } }
      open_assumptions: { type: array, items: { type: string } }
constraints: |
  - Output JSON ONLY: a top-level JSON ARRAY of objects, one per input row, SAME order and length.
  - evidence is a non-empty array of 1–4 items; open_assumptions is an array (possibly empty) of 0–3 items.
  - Each evidence item MUST be a single PLAIN STRING (one short sentence), NEVER an object/dict. Fold the
    evidence type and its test activity into that one sentence, e.g.
    "Dataset audit with a coverage matrix to show occluded-pedestrian cases are represented."
  - open_assumptions items are also plain strings.
  - Evidence should reference an evidence type / test activity from the catalogue and tie to a measure.
  - Each evidence item MUST reference the measure id(s) it verifies, e.g. "(SF1) ...", and every
    measure id in the row must be covered by at least one evidence item. Evidence must verify the
    measure, not restate the hazardous behavior or the safety goal.
  - Do not use the ':' or ';' characters. Ban vague words unless made specific.
payload_template: |
  {
    "rows": {{rows_prev_json}},
    "evidence_catalogue": {{evidence_json}}
  }
