title: AI_HAZOP_REVIEWER_PATCH_L3
inputs:
  - rows_l3_json
  - row_hints_json
instructions: |
  You receive CURRENT AI-HAZOP-8800 L3 initial-risk rows and targeted row-level hints.

  Your job:
  - Return the FULL list of L3 rows, in the SAME order and SAME length.
  - For targeted row_ids:
      * Edit ONLY fields listed in "fields"
        (subset of: ["E","PF","PND","PNM","S","risk_rationale"]).
      * Each of E/PF/PND/PNM/S MUST remain a valid ordinal level label (e.g. very_low, low,
        medium, high, very_high; severity: negligible, minor, moderate, serious, fatal).
      * Keep row_id, guideword, failure_mode, hazardous_behavior, potential_harm and context UNCHANGED.
      * Do NOT edit initial_risk or risk_status — the system recomputes those from your levels.
      * Use the suggestion text as guidance — INTERPRET it, do not copy it verbatim.
  - Non-targeted rows: return UNCHANGED (verbatim).

  STRICT OUTPUT: a top-level JSON ARRAY of row OBJECTS (same count as input). No outer wrapper, no prose.
output_schema: |
  type: array
  items:
    type: object
    required: [row_id, E, PF, PND, PNM, S, risk_rationale]
    properties:
      row_id: { type: string }
      E: { type: string }
      PF: { type: string }
      PND: { type: string }
      PNM: { type: string }
      S: { type: string }
      risk_rationale: { type: string }
constraints: |
  - Output JSON ONLY (an array of rows). Return the FULL list in the SAME order/length as rows_l3_json.
  - Non-targeted rows must be unchanged. Edit ONLY the listed fields for the targeted row_id(s).
  - Risk factor levels must remain valid ordinal labels. Do not emit numbers. Never use the ':' character.
payload_template: |
  {
    "rows_l3": {{rows_l3_json}},
    "row_hints": {{row_hints_json}}
  }
