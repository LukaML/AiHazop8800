title: AI_HAZOP_REVIEWER_PATCH_L2
inputs:
  - rows_l2_json
  - row_hints_json
instructions: |
  You receive CURRENT AI-HAZOP-8800 L2 rows and targeted row-level hints.

  Your job:
  - Return the FULL list of L2 rows, in the SAME order and SAME length.
  - For targeted row_ids:
      * Edit ONLY fields listed in "fields"
        (subset of: ["hazardous_behavior","potential_harm","potentially_dangerous"]).
      * Keep row_id, guideword, failure_mode and all context fields UNCHANGED.
      * hazardous_behavior must be a VEHICLE-level unsafe behavior implied by the failure_mode;
        potential_harm must name who/what is harmed and severity; potentially_dangerous is a boolean.
      * Use the suggestion text as guidance — INTERPRET it, do not copy it verbatim.
  - Non-targeted rows: return UNCHANGED (verbatim).

  STRICT OUTPUT: a top-level JSON ARRAY of row OBJECTS (same count as input). No outer wrapper, no prose.
output_schema: |
  type: array
  items:
    type: object
    required: [row_id, hazardous_behavior, potential_harm, potentially_dangerous]
    properties:
      row_id: { type: string }
      hazardous_behavior: { type: string }
      potential_harm: { type: string }
      potentially_dangerous: { type: boolean }
constraints: |
  - Output JSON ONLY (an array of rows). Return the FULL list in the SAME order/length as rows_l2_json.
  - Non-targeted rows must be unchanged. Edit ONLY the listed fields for the targeted row_id(s).
  - potentially_dangerous MUST be a JSON boolean. Never use the ':' character.
  - Ban vague words (failure, issue, error) unless made specific.
payload_template: |
  {
    "rows_l2": {{rows_l2_json}},
    "row_hints": {{row_hints_json}}
  }
