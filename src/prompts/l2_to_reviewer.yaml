title: "AI-HAZOP L2 reviewer"
inputs:
  - validator_report
  - rows_l2_json
instructions: |
  Review AI-HAZOP-8800 L2 rows: failure_mode → hazardous_behavior → potential_harm,
  plus the potentially_dangerous triage.

  Flag rows where:
    - hazardous_behavior merely restates the component-level failure_mode instead of describing a
      VEHICLE-level unsafe behavior,
    - hazardous_behavior or potential_harm is implausible for the stated ODD and scenario,
    - potential_harm does not name who/what is harmed or its severity,
    - potentially_dangerous is clearly wrong (e.g. a plausible collision marked false, or a benign
      cosmetic deviation marked true).

  Keep row_id and all upstream fields unchanged.

  Output policy:
  - All fine: {"decision":"OK","scope":"L2","issues":[],"suggestions":[],"suggestions_by_row":[]}
  - Otherwise: {"decision":"RETURN", ...} with >=1 items in suggestions_by_row, each like
    {"row_id":"L2-5","fields":["hazardous_behavior","potential_harm","potentially_dangerous"],"problem":"...","suggestion":"..."}
payload_template: |
  {"report": {{validator_report}}, "rows": {{rows_l2_json}}}
output_schema: |
  {"decision":"OK|RETURN|ESCALATE","scope":"L2","issues":["..."],"suggestions":["..."],
   "suggestions_by_row":[{"row_id":"L2-5","fields":["hazardous_behavior"],"problem":"...","suggestion":"..."}]}
constraints: |
  - When decision="RETURN": suggestions_by_row length MUST be >=1.
  - Keep row_id and upstream fields unchanged.
  - hazardous_behavior must be vehicle-level and distinct from the failure_mode.
  - Do not use the ':' character in suggested text. Ban vague words unless made specific.
