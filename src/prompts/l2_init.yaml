title: AI_HAZOP_L2_HAZARD
inputs:
  - rows_prev_json
instructions: |
  You receive AI-HAZOP-8800 L1 rows. Each row holds a component-level failure_mode for one
  guideword, plus the component, aspect, ODD and scenario context.

  TASK: For EACH input row, determine the vehicle-level HAZARD the failure_mode can cause in
  the given ODD and scenario, and triage its safety relevance. For each row produce:
    - hazardous_behavior: the unsafe vehicle-level behavior that the failure_mode could lead to
      (e.g. "The vehicle fails to yield and continues into the cyclist's path."). One natural sentence.
    - potential_harm: who/what may be harmed and how severely, written as ONE natural, human-sounding
      sentence (e.g. "A cyclist could be struck and suffer serious or fatal injury."). Do not list
      clauses with punctuation — write it the way a person would say it.
    - potentially_dangerous: true if this row is safety-relevant and must continue through risk
      analysis, and false if it cannot plausibly contribute to vehicle-level harm in this ODD or scenario.

  Translate component-level deviations into VEHICLE-level consequences — do not merely restate
  the failure_mode. Be realistic about the scenario and ODD (e.g. a low-speed campus shuttle).

  DISTINCTNESS (critical): each row's hazardous_behavior must be SPECIFIC to that failure_mode and
  guideword, and substantially different from the other rows — never a generic paraphrase. NEVER write
  vague text like "may cause a hazardous situation" or "could be dangerous".
  BAD (unacceptable): wrong -> "may cause hazardous situation"; late -> "may cause hazardous situation";
  corrupted -> "may cause hazardous situation".
  GOOD (specific, tied to the deviation):
    late          -> "The planner acts on a stale position and steers toward where the cyclist no longer is."
    misordered    -> "A newer pose is overwritten by an older one, so the path follows an outdated location."
    inverted      -> "Left and right are mirrored, so the shuttle steers to the wrong side of the cyclist."
    intermittent  -> "Position jumps make trajectory generation unstable and the shuttle swerves."

  Echo each row's "row_id" exactly. Output ONLY the new fields plus row_id (do not repeat the
  other fields).

output_schema: |
  type: array
  items:
    type: object
    required: [row_id, hazardous_behavior, potential_harm, potentially_dangerous]
    properties:
      row_id: { type: string }
      hazardous_behavior: { type: string }
      potential_harm: { type: string }
      potentially_dangerous: { type: boolean }
constraints: |
  - Output JSON ONLY: a top-level JSON ARRAY of objects, one per input row, SAME order and length.
  - Each object MUST contain: row_id, hazardous_behavior, potential_harm, potentially_dangerous.
  - potentially_dangerous MUST be a JSON boolean (true/false), never a string.
  - hazardous_behavior is vehicle-level; potential_harm names who/what is harmed and severity.
  - hazardous_behavior MUST be specific to the failure_mode and distinct across rows; never a generic
    paraphrase like "hazardous situation" or "may cause harm".
  - Write each field as ONE natural, flowing sentence as a person would say it.
  - Do NOT use the ':' or ';' characters anywhere. Use plain words, not semicolon-separated clauses.
payload_template: |
  {
    "rows_l1": {{rows_prev_json}}
  }
