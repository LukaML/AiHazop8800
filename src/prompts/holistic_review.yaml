title: AI_HAZOP_HOLISTIC_REVIEW
inputs:
  - rows_json
  - lite_findings
instructions: |
  You are the holistic reviewer for a completed AI-HAZOP-8800 worksheet. Each row is one
  guideword line carrying the full chain:
    guideword → failure_mode → hazardous_behavior / potential_harm → risk (E,PF,PND,PNM,S, initial_risk,
    risk_status) → safety_decision → ai_safety_goals → measures (respecifications / safety_functions /
    passive_operational_measures) → residual (residual_risk, residual_status) → evidence / open_assumptions.

  Check CROSS-PHASE CONSISTENCY and flag contradictions, broken logic, missing links, and mismatched
  evidence, for example:
    - hazardous_behavior does not follow from the failure_mode, or potential_harm severity is inconsistent
      with the chosen S level;
    - safety_decision contradicts risk_status (ACCEPT while ABOVE target; IMPROVE while ACCEPTABLE);
    - ai_safety_goals do not address the hazard, or measures do not implement the goals;
    - residual_status is ACCEPTABLE but the measures do not plausibly lower the factors that were reduced;
    - evidence does not support the proposed measures, or an ACCEPT row lacks justification evidence.

  Route each problem to the EARLIEST faulty phase (scope), because every downstream field depends on it:
  scope is one of L1, L2, L3, L4, L5, L6, L7, L8. Reference the offending row by its row_id.

  Output policy:
  - All consistent: {"decision":"OK","scope":"L1","issues":[],"suggestions":[],"suggestions_by_row":[]}
  - Otherwise: {"decision":"RETURN","scope":"<earliest faulty phase>", ...} with >=1 items in
    suggestions_by_row, each like {"row_id":"L1-3","fields":["..."],"problem":"...","suggestion":"..."}
payload_template: |
  {"findings": {{lite_findings}}, "rows": {{rows_json}}}
output_schema: |
  {"decision":"OK|RETURN","scope":"L1|L2|L3|L4|L5|L6|L7|L8","issues":["..."],"suggestions":["..."],
   "suggestions_by_row":[{"row_id":"L1-3","fields":["safety_decision"],"problem":"...","suggestion":"..."}]}
constraints: |
  - When decision="RETURN": scope MUST be the earliest faulty phase and suggestions_by_row length >=1.
  - Reference rows by their existing row_id. Do not invent rows. Do not use the ':' character in text.
