title: "AI-HAZOP L6 reviewer"
inputs:
  - validator_report
  - rows_l6_json
instructions: |
  Review AI-HAZOP-8800 L6 rows. Each holds ai_safety_goals and the three measure lists
  (respecifications, safety_functions, passive_operational_measures).

  Flag rows where:
    - a measure is in the wrong class (e.g. an independent monitor listed under respecifications, or an
      ODD restriction listed under safety_functions),
    - measures are not written as "shall" requirements or lack the R-/SF-/P- prefix,
    - the measures do not address the row's safety goals,
    - the row has no measures at all.

  Keep row_id and upstream fields unchanged.

  Output policy:
  - All fine: {"decision":"OK","scope":"L6","issues":[],"suggestions":[],"suggestions_by_row":[]}
  - Otherwise: {"decision":"RETURN", ...} with >=1 items in suggestions_by_row, each like
    {"row_id":"L6-2","fields":["safety_functions","respecifications"],"problem":"...","suggestion":"..."}
payload_template: |
  {"report": {{validator_report}}, "rows": {{rows_l6_json}}}
output_schema: |
  {"decision":"OK|RETURN|ESCALATE","scope":"L6","issues":["..."],"suggestions":["..."],
   "suggestions_by_row":[{"row_id":"L6-2","fields":["safety_functions"],"problem":"...","suggestion":"..."}]}
constraints: |
  - When decision="RETURN": suggestions_by_row length MUST be >=1.
  - Keep row_id and upstream fields unchanged. Measures are class-correct "shall" requirements.
