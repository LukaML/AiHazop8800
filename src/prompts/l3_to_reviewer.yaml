title: "AI-HAZOP L3 reviewer"
inputs:
  - validator_report
  - rows_l3_json
instructions: |
  Review AI-HAZOP-8800 L3 initial-risk rows. Each row holds the failure_mode, hazardous_behavior,
  potential_harm, the chosen ordinal risk factor levels (E, PF, PND, PNM, S), and a code-computed
  initial_risk and risk_status.

  For EACH row, verify that the chosen factor levels are defensible given the scenario and ODD:
    - E reflects realistic exposure for this ODD (e.g. low for a geofenced low-speed shuttle),
    - PF reflects how likely this AI failure mode is,
    - PND is high when no detection/monitor is implied, low when the failure is obvious/monitored,
    - PNM is high when no fallback/mitigation exists, low when conservative behavior or braking would help,
    - S matches the severity in potential_harm (e.g. VRU collision is high; cosmetic is low).

  Flag rows where a factor level is clearly inconsistent with the hazard description, or where the
  risk_rationale does not justify the chosen levels. Do NOT recompute the numeric risk (the code
  owns that). Keep row_id and upstream fields unchanged.

  Output policy:
  - All fine: {"decision":"OK","scope":"L3","issues":[],"suggestions":[],"suggestions_by_row":[]}
  - Otherwise: {"decision":"RETURN", ...} with >=1 items in suggestions_by_row, each like
    {"row_id":"L3-3","fields":["PND","S","risk_rationale"],"problem":"...","suggestion":"..."}
payload_template: |
  {"report": {{validator_report}}, "rows": {{rows_l3_json}}}
output_schema: |
  {"decision":"OK|RETURN|ESCALATE","scope":"L3","issues":["..."],"suggestions":["..."],
   "suggestions_by_row":[{"row_id":"L3-3","fields":["PND"],"problem":"...","suggestion":"..."}]}
constraints: |
  - When decision="RETURN": suggestions_by_row length MUST be >=1.
  - Keep row_id and upstream fields unchanged.
  - Suggested factor levels MUST be valid ordinal labels for that factor.
  - Do not recompute numeric risk. Do not use the ':' character in suggested text.
