title: AI_HAZOP_L3_INITIAL_RISK
inputs:
  - rows_prev_json
  - risk_scales_json
  - mem_target
instructions: |
  You receive AI-HAZOP-8800 L2 rows that were triaged as potentially dangerous. Each row holds the
  failure_mode, hazardous_behavior, potential_harm, and the component/ODD/scenario context.

  STRICT SCOPE: output ONLY the risk factor levels and risk_rationale. NEVER write reviewer/validator/
  repair instructions or copy any suggestion text; banned text like "ensure consistency" must not appear.

  TASK: For EACH row, estimate the initial risk by selecting ONE ORDINAL LEVEL for each of the five
  factors, choosing strictly from the allowed labels in "risk_scales" (do NOT invent labels and do
  NOT output numbers):
    - E   Exposure to this scenario/function per person-year.
    - PF  Probability the AI failure mode occurs in this scenario.
    - PND Probability the failure is NOT detected before it causes harm.
    - PNM Probability NO mitigation prevents harm after the failure.
    - S   Fatality-equivalent severity of the potential harm.

  CALIBRATION — choose levels realistically, not optimistically. This is INITIAL risk, BEFORE any
  safety measures (monitors, fallbacks, conservative behavior, independent checks are only added
  later in L6), so do NOT credit protections that are not already part of the baseline component.
    - PF  Learned AI perception/decision failures in their triggering conditions are NOT rare events.
          For the relevant scenario, PF is typically medium to high. Reserve very_low or low only for
          failure modes that are genuinely implausible for this component, not as a default.
    - PND Without an independent monitor or consistency check (none exist yet at L3), the failure is
          usually medium to high probability of going undetected. The AI's own confidence is NOT
          detection.
    - PNM With no dedicated mitigation yet, PNM is usually medium to high unless an inherent baseline
          behavior already prevents harm.
    - S   Rate by the WORST CREDIBLE outcome of the hazardous_behavior/potential_harm, not an average.
          A collision with a vulnerable road user (cyclist, pedestrian) is serious to fatal.
    - E   Exposure reflects how often the scenario/function occurs per person-year.
  Apply the ODD where it actually belongs. Low speed and geofencing mainly reduce E and S; they do
  NOT by themselves make PF, PND, or PNM low.

  DIVERSITY (hard rule): choose factor levels that genuinely reflect THIS hazard — do NOT reuse the same
  five levels for every row. Within one component/aspect/scenario, the rows MUST NOT all share an
  identical E/PF/PND/PNM/S tuple; different failure modes (a missed VRU vs. a false positive vs. a stale
  output) warrant clearly different factors. In risk_rationale, justify EACH factor briefly (one short
  clause for E, for PF, for PND, for PNM, and for S).

  VRU SEVERITY (hard rule): if the hazardous_behavior or potential_harm describes the vehicle striking,
  colliding with, or running over a vulnerable road user (pedestrian, cyclist, child, …), severity S MUST
  be at least "serious" (serious or fatal). A pedestrian/cyclist impact is never "moderate" or lower.

  Guideword-specific guidance:
    - "no", "less", "late", "frozen", "uncertain_but_confident", "valid_but_unsafe" usually have
      HIGHER PND/PNM when they hide or under-report a vulnerable road user (the failure is silent
      and hard to mitigate downstream).
    - "more" / false-positive cases usually have LOWER severity S unless they trigger abrupt braking
      or an unsafe evasive maneuver.
    - "inverted", "wrong", "misordered" affecting position/direction often keep S high because the
      vehicle acts confidently on a wrong value.
  A high-confidence false negative, a skipped detection (e.g. due to GPU load), a stale position, or a
  count-only valid-but-unsafe output that HIDES a vulnerable road user is normally ABOVE the MEM target,
  not acceptable by default: use medium-to-high PND and PNM (no monitor exists yet at L3) with serious or
  fatal S. Do NOT make such a hazard come out ACCEPTABLE without a strong, explicit rationale.

  CALIBRATION REFERENCE (reason from it, do NOT copy a fixed tuple): a silent failure that hides a
  vulnerable road user with no independent monitor lands clearly ABOVE the MEM target; a benign false
  positive with a conservative baseline lands much lower. Spread the factors across rows accordingly —
  reason each factor from THIS row's deviation, ODD, and scenario rather than repeating one preset.

  Do NOT compute the numeric risk value — the system computes R = E·PF·PND·PNM·S from your chosen
  levels and compares it to the MEM target ("mem_target").

  Echo each row's "row_id" exactly. Output ONLY the new fields plus row_id.

output_schema: |
  type: array
  items:
    type: object
    required: [row_id, E, PF, PND, PNM, S, risk_rationale]
    properties:
      row_id: { type: string }
      E: { type: string }
      PF: { type: string }
      PND: { type: string }
      PNM: { type: string }
      S: { type: string }
      risk_rationale: { type: string }
constraints: |
  - Output JSON ONLY: a top-level JSON ARRAY of objects, one per input row, SAME order and length.
  - Each object MUST contain: row_id, E, PF, PND, PNM, S, risk_rationale.
  - E/PF/PND/PNM/S MUST each be one of the allowed ordinal labels from "risk_scales" for that factor.
  - Do NOT output numeric factor values and do NOT compute the risk product yourself.
  - risk_rationale must justify all five factors (a short clause each for E, PF, PND, PNM, S).
  - Within one component/aspect/scenario, rows must NOT all share an identical E/PF/PND/PNM/S tuple.
  - If the harm is contact with a vulnerable road user, S must be serious or fatal.
  - Do not use the ':' character.
payload_template: |
  {
    "rows_l2": {{rows_prev_json}},
    "risk_scales": {{risk_scales_json}},
    "mem_target": {{mem_target}}
  }
